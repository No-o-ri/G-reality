[project]
name = "g-reality"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "google-genai>=1.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# GPU extra is installed separately from the PyTorch index:
#   pip install "torch==2.14.1+cu130" --index-url https://download.pytorch.org/whl/cu130

[tool.pytest.ini_options]
pythonpath = ["services", "packages/contracts/python", "scripts"]
testpaths = ["tests"]
markers = [
    "neon: needs DATABASE_URL pointing at the Neon dev branch",
    "gemini: calls the real Gemini API (needs GEMINI_API_KEY)",
    "cuda: needs CUDA PyTorch (runs in WSL2, see docs/testing/CHUNK3_RESULTS.md)",
]
addopts = "-q -p no:cacheprovider"
